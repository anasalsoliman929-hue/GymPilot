name: gympilot_member
description: GymPilot - Member App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get: ^4.6.6
  get_storage: ^2.1.1
  dio: ^5.4.3
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  iconsax: ^0.0.8
  intl: 0.20.2
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/qr_code.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"